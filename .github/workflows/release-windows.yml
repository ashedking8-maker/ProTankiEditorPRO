name: Release ProTanki Editor PRO for Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Verify complete source and packaging workflow
        shell: powershell
        run: python tools/check_source_consistency.py

      - name: Read-only native format and map delta audit tests
        shell: powershell
        run: python -m unittest discover -s tests -p "test_*audit.py" -v

      - name: Set up Node for Discord gateway tests
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Test Discord gateway without sending messages
        shell: powershell
        run: node report_gateway/discord/test_gateway.mjs

      - name: Install packaging tools
        shell: powershell
        run: |
          choco install nsis -y --no-progress
          choco install 7zip -y --no-progress

      - name: Configure x64 Release
        shell: powershell
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DPTPRO_BUG_REPORT_ENDPOINT="${{ vars.PTPRO_BUG_REPORT_ENDPOINT }}"

      - name: Compile editor
        shell: powershell
        run: cmake --build build --config Release --parallel

      - name: Run regression tests
        shell: powershell
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package setup EXE and portable ZIP
        shell: powershell
        run: .\scripts\package-windows.ps1 -BuildDir build

      - name: Record package SHA-256 digests
        shell: powershell
        run: |
          $files = @("build/ProTankiEditorPRO-0.5.28-Setup.exe", "build/ProTankiEditorPRO-0.5.28-Portable.zip")
          $files | ForEach-Object {
            if (!(Test-Path $_)) { throw "Cannot hash missing package: $_" }
            $hash = (Get-FileHash -Algorithm SHA256 -Path $_).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($_))"
          } | Set-Content -Encoding ASCII "build/ProTankiEditorPRO-0.5.28-SHA256.txt"

      - name: Verify exact release filenames
        shell: powershell
        run: |
          if (!(Test-Path "build/ProTankiEditorPRO-0.5.28-Setup.exe")) { throw "Setup EXE was not created" }
          if (!(Test-Path "build/ProTankiEditorPRO-0.5.28-Portable.zip")) { throw "Portable ZIP was not created" }

      - name: Create AES-256 encrypted Windows package
        shell: powershell
        env:
          ARCHIVE_PASSWORD: ${{ secrets.ARCHIVE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ARCHIVE_PASSWORD)) {
            throw "Repository secret ARCHIVE_PASSWORD is missing or empty"
          }
          $sevenZip = Join-Path $env:ProgramFiles "7-Zip\7z.exe"
          if (!(Test-Path $sevenZip)) { throw "7-Zip was not found at $sevenZip" }

          $archive = "build/ProTankiEditorPRO-0.5.28-Windows-Encrypted.7z"
          if (Test-Path $archive) { Remove-Item $archive -Force }

          & $sevenZip a -t7z -mx=9 -mhe=on "-p$env:ARCHIVE_PASSWORD" $archive `
            "build/ProTankiEditorPRO-0.5.28-Setup.exe" `
            "build/ProTankiEditorPRO-0.5.28-Portable.zip" `
            "build/ProTankiEditorPRO-0.5.28-SHA256.txt"
          if ($LASTEXITCODE -ne 0) { throw "AES-256 archive creation failed" }
          if (!(Test-Path $archive)) { throw "Encrypted archive was not created" }

          $hash = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($archive))" | Set-Content -Encoding ASCII "build/ProTankiEditorPRO-0.5.28-Encrypted-SHA256.txt"

      - name: Publish encrypted GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "build/ProTankiEditorPRO-0.5.28-Windows-Encrypted.7z#ProTankiEditorPRO-0.5.28-Windows-Encrypted.7z" `
            "build/ProTankiEditorPRO-0.5.28-Encrypted-SHA256.txt#ProTankiEditorPRO-0.5.28-Encrypted-SHA256.txt" `
            --title "ProTanki Editor PRO ${{ github.ref_name }}" `
            --notes "Windows x64 build candidate. The 7z package is AES-256 encrypted and requires the separately shared password." `
            --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Cannot create encrypted tag release" }
