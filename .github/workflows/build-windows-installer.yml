name: Build ProTanki Editor PRO for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Show checked-out commit
        shell: powershell
        run: git log -1 --format="%h %s"

      - name: Verify complete source and packaging workflow
        shell: powershell
        run: python tools/check_source_consistency.py

      - name: Read-only native format and map delta audit tests
        shell: powershell
        run: python -m unittest discover -s tests -p "test_*audit.py" -v

      - name: Set up Node for Discord gateway tests
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Test Discord gateway without sending messages
        shell: powershell
        run: node report_gateway/discord/test_gateway.mjs

      - name: Install packaging tools
        shell: powershell
        run: |
          choco install nsis -y --no-progress
          choco install 7zip -y --no-progress

      - name: Configure x64 Release
        shell: powershell
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DPTPRO_BUG_REPORT_ENDPOINT="${{ vars.PTPRO_BUG_REPORT_ENDPOINT }}"

      - name: Compile editor
        shell: powershell
        run: cmake --build build --config Release --parallel

      - name: Run regression tests
        shell: powershell
        run: ctest --test-dir build -C Release --output-on-failure

      # IMPORTANT: Use our single-user custom NSIS installer. `cpack -G NSIS`
      # instead creates a different installer and, with the portable CPack name,
      # calls it ProTankiEditorPRO-0.5.28-Portable.exe.
      - name: Package setup EXE and portable ZIP
        shell: powershell
        run: .\scripts\package-windows.ps1 -BuildDir build

      - name: Record package SHA-256 digests
        shell: powershell
        run: |
          $files = @("build/ProTankiEditorPRO-0.5.28-Setup.exe", "build/ProTankiEditorPRO-0.5.28-Portable.zip")
          $files | ForEach-Object {
            if (!(Test-Path $_)) { throw "Cannot hash missing package: $_" }
            $hash = (Get-FileHash -Algorithm SHA256 -Path $_).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($_))"
          } | Set-Content -Encoding ASCII "build/ProTankiEditorPRO-0.5.28-SHA256.txt"

      - name: Verify exact release filenames
        shell: powershell
        run: |
          if (!(Test-Path "build/ProTankiEditorPRO-0.5.28-Setup.exe")) {
            throw "ProTankiEditorPRO-0.5.28-Setup.exe was not created"
          }
          if (!(Test-Path "build/ProTankiEditorPRO-0.5.28-Portable.zip")) {
            throw "ProTankiEditorPRO-0.5.28-Portable.zip was not created"
          }

      - name: Create AES-256 encrypted Windows package
        shell: powershell
        env:
          ARCHIVE_PASSWORD: ${{ secrets.ARCHIVE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ARCHIVE_PASSWORD)) {
            throw "Repository secret ARCHIVE_PASSWORD is missing or empty"
          }
          $sevenZip = Join-Path $env:ProgramFiles "7-Zip\7z.exe"
          if (!(Test-Path $sevenZip)) { throw "7-Zip was not found at $sevenZip" }

          $archive = "build/ProTankiEditorPRO-0.5.28-Windows-Encrypted.7z"
          if (Test-Path $archive) { Remove-Item $archive -Force }

          & $sevenZip a -t7z -mx=9 -mhe=on "-p$env:ARCHIVE_PASSWORD" $archive `
            "build/ProTankiEditorPRO-0.5.28-Setup.exe" `
            "build/ProTankiEditorPRO-0.5.28-Portable.zip" `
            "build/ProTankiEditorPRO-0.5.28-SHA256.txt"
          if ($LASTEXITCODE -ne 0) { throw "AES-256 archive creation failed" }
          if (!(Test-Path $archive)) { throw "Encrypted archive was not created" }

          $hash = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($archive))" | Set-Content -Encoding ASCII "build/ProTankiEditorPRO-0.5.28-Encrypted-SHA256.txt"

      - name: Upload encrypted Windows package
        uses: actions/upload-artifact@v6
        with:
          name: ProTankiEditorPRO-Windows-0.5.28-Encrypted
          path: |
            build/ProTankiEditorPRO-0.5.28-Windows-Encrypted.7z
            build/ProTankiEditorPRO-0.5.28-Encrypted-SHA256.txt
          if-no-files-found: error

      - name: Publish direct download in Releases
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "latest-build"
          # Listing releases succeeds when latest-build does not exist yet.
          # Do not run `gh release view` on a missing tag: Windows PowerShell 5.1
          # turns its stderr into a NativeCommandError even when nonzero is expected.
          $releases = @(gh release list --json tagName --limit 1000 | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw "Cannot list GitHub Releases" }
          $releaseExists = $null -ne ($releases | Where-Object { $_.tagName -eq $tag } | Select-Object -First 1)
          if (-not $releaseExists) {
            gh release create $tag `
              --target "${{ github.sha }}" `
              --title "ProTanki Editor PRO - Latest Build" `
              --notes "Automatic Windows x64 development build. The downloadable 7z package is AES-256 encrypted and requires the separately shared password." `
              --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Cannot create latest-build release" }
          }
          # Remove plaintext assets left by older workflows, if present.
          $release = gh release view $tag --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Cannot inspect latest-build release assets" }
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          $plaintextAssets = @(
            "ProTankiEditorPRO-0.5.28-Setup.exe",
            "ProTankiEditorPRO-0.5.28-Portable.zip",
            "ProTankiEditorPRO-0.5.28-SHA256.txt"
          )
          foreach ($asset in $plaintextAssets) {
            if ($assetNames -contains $asset) {
              gh release delete-asset $tag $asset -y
              if ($LASTEXITCODE -ne 0) { throw "Cannot remove old plaintext release asset: $asset" }
            }
          }

          gh release upload $tag `
            "build/ProTankiEditorPRO-0.5.28-Windows-Encrypted.7z#ProTankiEditorPRO-0.5.28-Windows-Encrypted.7z" `
            "build/ProTankiEditorPRO-0.5.28-Encrypted-SHA256.txt#ProTankiEditorPRO-0.5.28-Encrypted-SHA256.txt" `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw "Cannot upload encrypted release assets" }
